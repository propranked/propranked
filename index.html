<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropRanked - Best Prop Trading Firms 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f1419; color: #e0e0e0; line-height: 1.6; }
        header { background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%); padding: 40px 20px; text-align: center; border-bottom: 2px solid #00d084; }
        h1 { font-size: 2.5em; color: #00d084; margin-bottom: 10px; }
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; align-items: center; }
        .filter-dropdown { background-color: #1a1f2e; color: #00d084; border: 2px solid #00d084; padding: 12px 15px; border-radius: 5px; font-weight: bold; }
        .sort-buttons { display: flex; gap: 10px; }
        .sort-btn { background-color: #00d084; color: #0f1419; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .sort-btn:hover { background-color: #00e699; }
        .table-wrapper { background-color: #1a1f2e; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 20px rgba(0, 208, 132, 0.1); }
        table { width: 100%; border-collapse: collapse; }
        thead { background-color: #0f1419; border-bottom: 2px solid #00d084; }
        th { color: #00d084; padding: 20px; text-align: left; font-weight: bold; }
        td { padding: 15px 20px; border-bottom: 1px solid #2a2f3e; }
        tr:hover { background-color: #252a38; }
        .discount { color: #00d084; font-weight: bold; }
        .status { padding: 8px 12px; border-radius: 4px; text-align: center; font-weight: bold; }
        .status.verified { background-color: #2d5a3d; color: #4caf50; }
        .status.pending { background-color: #5a5233; color: #ffc107; }
        .btn-copy { background-color: #00d084; color: #0f1419; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-copy:hover { background-color: #00e699; }
        footer { background-color: #1a1f2e; border-top: 2px solid #00d084; padding: 30px 20px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>🏆 PropRanked</h1>
        <p>Compare the best prop trading firms - 22 firms listed</p>
    </header>

    <div class="container">
        <div class="controls">
            <label style="color: #00d084; font-weight: bold;">🔍 Prop Firm Finder:</label>
            <select id="filterDropdown" class="filter-dropdown">
                <option value="">All Firms</option>
                <option value="Best Pricing">Best Pricing (40%+)</option>
            </select>
            <div class="sort-buttons">
                <button class="sort-btn" onclick="sortTable('firm')">Sort by Firm</button>
                <button class="sort-btn" onclick="sortTable('rating')">Sort by Rating</button>
                <button class="sort-btn" onclick="sortTable('discount')">Sort by Discount</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Firm Name</th>
                        <th>Rating</th>
                        <th>Discount</th>
                        <th>Trading Platforms</th>
                        <th>Max Accounts</th>
                        <th>Status</th>
                        <th>Affiliate Code</th>
                    </tr>
                </thead>
                <tbody id="comparisonTable">
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PropRanked. All rights reserved.</p>
    </footer>

    <script>
        const firmsData = [
            {name: "Apex Trader Funding", rating: "⭐⭐⭐⭐⭐", discount: "85%", platforms: "Tradovate, Rhythmic", max_accounts: "20", status: "Verified", code: "APEX"},
            {name: "TopStep Trader", rating: "⭐⭐⭐⭐⭐", discount: "30%", platforms: "Tradovate, Rhythmic", max_accounts: "10", status: "Verified", code: "TOPSTEP"},
            {name: "FTMO", rating: "⭐⭐⭐⭐", discount: "20%", platforms: "MT4/MT5, cTrader", max_accounts: "15", status: "Verified", code: "FTMO"},
            {name: "FundedNext", rating: "⭐⭐⭐⭐⭐", discount: "40%", platforms: "Tradovate, cTrader", max_accounts: "12", status: "Verified", code: "FUNDEDNEXT"},
            {name: "The5ers", rating: "⭐⭐⭐⭐⭐", discount: "25%", platforms: "MT4/MT5, TradingView", max_accounts: "8", status: "Verified", code: "THE5ERS"},
            {name: "E8 Funding", rating: "⭐⭐⭐⭐", discount: "35%", platforms: "Tradovate, NinjaTrader", max_accounts: "6", status: "Verified", code: "E8"},
            {name: "Earn2Trade", rating: "⭐⭐⭐⭐", discount: "45%", platforms: "Tradovate, ThinkOrSwim", max_accounts: "10", status: "Verified", code: "EARN2TRADE"},
            {name: "Blue Guardian", rating: "⭐⭐⭐⭐", discount: "50%", platforms: "MT4/MT5", max_accounts: "5", status: "Verified", code: "BLUE"},
            {name: "FXIFY", rating: "⭐⭐⭐⭐", discount: "15%", platforms: "MT4/MT5, cTrader", max_accounts: "7", status: "Pending", code: "FXIFY"},
            {name: "Lucid Trading", rating: "⭐⭐⭐⭐", discount: "50%", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "LUCID"},
            {name: "WarBux", rating: "⭐⭐⭐⭐", discount: "20%", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "WARBUX"},
            {name: "Take Profit Trader", rating: "⭐⭐⭐⭐", discount: "40%", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "TPT"},
            {name: "Tradeify", rating: "⭐⭐⭐⭐", discount: "30%", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "TRADEIFY"},
            {name: "Legends Trading", rating: "⭐⭐⭐⭐", discount: "35%", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "LEGENDS"},
            {name: "MyFundedFutures", rating: "⭐⭐⭐⭐", discount: "N/A", platforms: "Tradovate", max_accounts: "N/A", status: "Pending", code: "MFF"},
            {name: "Funded Futures Network", rating: "⭐⭐⭐⭐", discount: "40%", platforms: "Tradovate", max_accounts: "N/A", status: "Verified", code: "FFN"},
            {name: "DayTraders.com", rating: "⭐⭐⭐⭐", discount: "N/A", platforms: "Tradovate", max_accounts: "N/A", status: "Pending", code: "DAYTRADERS"},
            {name: "TheTradesMakers", rating: "⭐⭐⭐⭐", discount: "N/A", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "TTM"},
            {name: "BluSky Trading", rating: "⭐⭐⭐⭐", discount: "N/A", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "BLUSKY"},
            {name: "Bulenox", rating: "⭐⭐⭐⭐", discount: "N/A", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "BULENOX"},
            {name: "TradeDay", rating: "⭐⭐⭐", discount: "30%", platforms: "MT4/MT5, cTrader", max_accounts: "5", status: "Verified", code: "TRADEDAY"},
            {name: "UProfit", rating: "⭐⭐⭐⭐", discount: "N/A", platforms: "MT4/MT5", max_accounts: "N/A", status: "Pending", code: "UPROFIT"}
        ];

        function renderTable(data) {
            const tableBody = document.getElementById('comparisonTable');
            tableBody.innerHTML = '';
            data.forEach(firm => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${firm.name}</td>
                    <td>${firm.rating}</td>
                    <td class="discount">${firm.discount}</td>
                    <td>${firm.platforms}</td>
                    <td>${firm.max_accounts}</td>
                    <td><span class="status ${firm.status.toLowerCase()}">${firm.status}</span></td>
                    <td><button class="btn-copy" onclick="copyToClipboard('${firm.code}', this)">Copy: ${firm.code}</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        function copyToClipboard(code, button) {
            navigator.clipboard.writeText(code).then(() => {
                button.textContent = '✓ Copied!';
                setTimeout(() => { button.textContent = 'Copy: ' + code; }, 2000);
            });
        }

        function sortTable(by) {
            let sorted = [...firmsData];
            if (by === 'firm') sorted.sort((a, b) => a.name.localeCompare(b.name));
            else if (by === 'rating') sorted.sort((a, b) => b.rating.length - a.rating.length);
            else if (by === 'discount') sorted.sort((a, b) => (parseInt(b.discount) || 0) - (parseInt(a.discount) || 0));
            renderTable(sorted);
        }

        renderTable(firmsData);
    </script>
</body>
</html>
