name: Auto-Update PropRanked Website

on:
  schedule:
    - cron: '5 7 * * *'
  workflow_dispatch:

jobs:
  update-website:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install openpyxl requests beautifulsoup4
          
      - name: Update comparison table
        run: |
          python3 << 'PYTHON'
          import openpyxl
          import re
          
          wb = openpyxl.load_workbook('PropRanked_Master_Data_Complete.xlsx')
          sheet = wb.active
          
          html_rows = []
          for row in sheet.iter_rows(min_row=2, max_row=sheet.max_row, values_only=True):
              if row[0]:
                  firm_name = row[0]
                  discount = row[1] or 'N/A'
                  max_accounts = row[2] or 'N/A'
                  platforms = row[3] or 'N/A'
                  rating = row[4] or '4'
                  affiliate_code = row[5] or 'TBD'
                  status = row[7] or 'Pending'
                  
                  stars = '⭐' * int(float(str(rating).split('.')[0]) if rating else 4)
                  status_class = status.lower()
                  
                  row_html = f'''            <tr>
                        <td class="firm-name">{firm_name}</td>
                        <td class="rating">{stars}</td>
                        <td class="discount">{discount}</td>
                        <td>{platforms}</td>
                        <td>{max_accounts}</td>
                        <td><span class="status {status_class}">{status}</span></td>
                        <td><button class="btn-copy" onclick="copyToClipboard('{affiliate_code}', this)">Copy: {affiliate_code}</button></td>
                    </tr>'''
                  html_rows.append(row_html)
          
          with open('index-enhanced.html', 'r') as f:
              content = f.read()
          
          new_tbody = '<tbody id="comparisonTable">\n' + '\n'.join(html_rows) + '\n            </tbody>'
          content = re.sub(r'<tbody id="comparisonTable">.*?</tbody>', new_tbody, content, flags=re.DOTALL)
          
          with open('index-enhanced.html', 'w') as f:
              f.write(content)
          
          print("✓ Updated comparison table")
          PYTHON
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "PropRanked Bot"
          git add -A
          git commit -m "Auto-update: PropRanked comparison table sync" || true
          git push origin main || true
